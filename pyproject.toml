[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morns"
version = "0.1.0"
description = "Mapping Observed Radio Network Signals — Open Radio Observatory"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "meshtastic>=2.5,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
morns = "morns.cli:main"
morns-collector = "morns.collector_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
morns = ["templates/*.html", "data/*.zip", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
